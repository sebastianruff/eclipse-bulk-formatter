<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Format incl. Subpackages: a package tree with a "{ ... }" code block per package -->
  <rect width="256" height="256" rx="44" fill="#1f2a44"/>
  <g fill="none" stroke="#5b6b8f" stroke-width="6" stroke-linecap="round">
    <path d="M58 86 V137 H92"/>
    <path d="M110 158 V189 H122"/>
  </g>
  <g>
    <!-- package glyphs -->
    <g fill="#f2b84b">
      <rect x="36" y="42" width="44" height="40" rx="6"/>
      <rect x="92" y="120" width="36" height="34" rx="5"/>
      <rect x="122" y="174" width="32" height="30" rx="5"/>
    </g>
    <g fill="#c98f2a">
      <rect x="36" y="42" width="44" height="12" rx="6"/>
      <rect x="92" y="120" width="36" height="10" rx="5"/>
      <rect x="122" y="174" width="32" height="9" rx="4.5"/>
    </g>
    <!-- "{ ... }" code blocks -->
    <g font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#e8edf7">
      <text x="92" y="73" font-size="30"><tspan fill="#8fd3c7">{</tspan> ... <tspan fill="#8fd3c7">}</tspan></text>
      <text x="138" y="145" font-size="22"><tspan fill="#8fd3c7">{</tspan> ... <tspan fill="#8fd3c7">}</tspan></text>
      <text x="164" y="196" font-size="17"><tspan fill="#8fd3c7">{</tspan> ... <tspan fill="#8fd3c7">}</tspan></text>
    </g>
  </g>
</svg>
