<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Format incl. Subpackages: a package tree whose rows are neatly aligned code lines -->
  <rect width="256" height="256" rx="44" fill="#1f2a44"/>
  <g fill="none" stroke="#5b6b8f" stroke-width="6" stroke-linecap="round">
    <path d="M58 86 V137 H92"/>
    <path d="M110 158 V189 H122"/>
  </g>
  <g>
    <!-- package glyphs -->
    <g fill="#f2b84b">
      <rect x="36" y="42" width="44" height="40" rx="6"/>
      <rect x="92" y="120" width="36" height="34" rx="5"/>
      <rect x="122" y="174" width="32" height="30" rx="5"/>
    </g>
    <g fill="#c98f2a">
      <rect x="36" y="42" width="44" height="12" rx="6"/>
      <rect x="92" y="120" width="36" height="10" rx="5"/>
      <rect x="122" y="174" width="32" height="9" rx="4.5"/>
    </g>
    <!-- aligned code lines -->
    <g fill="#e8edf7">
      <rect x="94" y="48" width="118" height="10" rx="5"/>
      <rect x="94" y="66" width="84" height="10" rx="5" fill="#8fd3c7"/>
      <rect x="140" y="124" width="76" height="9" rx="4.5"/>
      <rect x="140" y="140" width="52" height="9" rx="4.5" fill="#8fd3c7"/>
      <rect x="166" y="178" width="54" height="8" rx="4"/>
      <rect x="166" y="192" width="36" height="8" rx="4" fill="#8fd3c7"/>
    </g>
  </g>
</svg>
