name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        # the UI tests need a display; the update site is PGP-signed when the signing key secret is available
        # (not on forks/PRs), see site/pom.xml
        run: |
          if [ -n "$MAVEN_GPG_KEY" ]; then
            printf '%s\n' "$MAVEN_GPG_KEY" > "$RUNNER_TEMP/signing-key.asc"
            SIGNING="-Dsigning.keyFile=$RUNNER_TEMP/signing-key.asc"
          fi
          xvfb-run --auto-servernum mvn -B clean verify $SIGNING
          rm -f "$RUNNER_TEMP/signing-key.asc"
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Prepare update site
        run: |
          cp -r site/target/repository _site
          # zip the signed repository (Tycho's own zip is created before signing)
          (cd _site && zip -qr ../format-incl-subpackages.zip .)
          mv format-incl-subpackages.zip _site/
          cp .github/pages/index.html marketplace/logo.png signing-key.asc _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
